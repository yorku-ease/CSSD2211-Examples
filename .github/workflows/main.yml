name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies (ratings service)
      working-directory: MovieRecommenderV6/ratings_service
      run: pip install -r requirements.txt

    - name: Run tests (ratings service)
      working-directory: MovieRecommenderV6/ratings_service
      run: pytest -q

    - name: Install dependencies (recommender service)
      working-directory: MovieRecommenderV6/recommender_service
      run: pip install -r requirements.txt

    - name: Run tests (recommender service)
      working-directory: MovieRecommenderV6/recommender_service
      run: pytest -q

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push ratings-service image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ratings-service:v1 MovieRecommenderV6
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ratings-service:v1

    - name: Build and push recommender-service image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recommender-service:v1 MovieRecommenderV6
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/recommender-service:v1

    - name: Set up kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kubeconfig
        export KUBECONFIG=$HOME/.kubeconfig

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/ratings-service ratings-service=${{ secrets.DOCKERHUB_USERNAME }}/ratings-service:latest
        kubectl set image deployment/recommender-service recommender-service=${{ secrets.DOCKERHUB_USERNAME }}/recommender-service:latest
